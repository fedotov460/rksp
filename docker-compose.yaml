version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"  # Используем порт 5433 вместо 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: